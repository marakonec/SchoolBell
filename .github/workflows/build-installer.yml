# Збирає SchoolBell-Setup.exe на GitHub (Windows-сервер).
# Запуск: вкладка Actions → «Build installer» → Run workflow,
# автоматично при push у master (реліз v<версія> створюється сам, версія з SchoolBell.App.csproj)
# або при push тегу v* — тоді інсталятор додається до Release цього тегу.
name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content 'src\SchoolBell.App\SchoolBell.App.csproj'
          $v = ($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SchoolBell-Setup
          path: dist/*.exe

      - name: Attach to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

      - name: Release from master
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Шкільний дзвінок ${{ steps.ver.outputs.version }}
          body: |
            Інсталятор зібрано автоматично з коміту ${{ github.sha }}.
            Опис змін у README, розділ «Зміни в цьому форку».
          files: dist/*.exe
